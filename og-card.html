<!DOCTYPE html>
<!-- Source for og-card.png, the 1200x630 social-preview image. To recapture:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless=new --disable-gpu --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 \
    --virtual-time-budget=9000 \
    --screenshot=og-card.png "file://$PWD/og-card.html"

  The virtual-time budget gives the webfonts time to arrive before the shot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card — 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<script>
// The graphics library rebuilds its canvas from a ResizeObserver; on a busy
// layout frame the browser reports the benign "loop completed" notice as a
// console error. Silence exactly that notice and nothing else.
addEventListener('error', function(e){
  if (e.message && String(e.message).indexOf('ResizeObserver loop') === 0){
    e.stopImmediatePropagation(); e.preventDefault();
  }
}, true);
</script>
<style>
body{margin:0; background:#8a8578; display:grid; place-items:center; min-height:100vh;
  font-family:"Source Serif 4",Georgia,serif}
#card{position:relative; width:1200px; height:630px; background:#F3EFE6; overflow:hidden; flex:none}
#card canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.veil{position:absolute; inset:0;
  background:linear-gradient(100deg, rgba(243,239,230,.97) 0%, rgba(243,239,230,.93) 42%, rgba(243,239,230,.55) 68%, rgba(243,239,230,.08) 100%)}
.content{position:absolute; inset:0; padding:60px 64px; display:flex; flex-direction:column; justify-content:space-between; color:#211E17}
.top{display:flex; justify-content:space-between; align-items:center; font-size:22px; font-weight:600}
.pill{background:#2440C8; color:#F1ECDF; border-radius:999px; padding:.55em 1.1em; font:600 18px/1 "Fraunces",Georgia,serif; letter-spacing:.01em}
h1{font:600 76px/1.06 "Fraunces",Georgia,serif; margin:0; max-width:920px; letter-spacing:0}
.domains{font:italic 500 23px/1.4 "Source Serif 4",Georgia,serif; color:#1B31A5; margin-top:26px}
.bot{display:flex; align-items:center; gap:14px; font-size:20px; font-weight:600; color:#6C6555}
</style>
</head>
<body>
<div id="card">
  <canvas id="cv-og"></canvas>
  <div class="veil"></div>
  <div class="content">
    <div class="top">
      <span>Utkarsh Singh — Software Engineer</span>
      <span class="pill">Remote only</span>
    </div>
    <div>
      <h1>I drop into any stack and ship the whole thing.</h1>
      <p class="domains">Vehicle networks · ARKit · GPU perception · embeddings · CFD · pen plotters</p>
    </div>
    <div class="bot">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#211E17" stroke-width="4"><circle cx="25" cy="32" r="15"/><circle cx="39" cy="32" r="15"/></g><path d="M32 18.75 A15 15 0 0 1 32 45.25 A15 15 0 0 1 32 18.75 Z" fill="#2440C8"/></svg>
      <span>feynma1h.github.io</span>
    </div>
  </div>
</div>
<script>
/* ====================================================================
   Portfolio graphics — every figure on the page is drawn at runtime
   by this library. No image assets, no dependencies.

   API
   ---
   PortfolioGraphics.setPalette({bg, fg, accent, muted, blue, light})
     Colors as hex ('#RGB'/'#RRGGBB') or 'rgb(…)' strings. `light:true`
     when the background is light — fade rates differ. Set before
     mounting; after a palette change, set again and call rebuildAll().

   PortfolioGraphics.config({ monoFont:'…' })
     Font stack for the text drawn inside the pdu figure.

   PortfolioGraphics.mount(canvasEl, mode, opts) -> handle
     Attach a figure to a <canvas> that already has CSS layout (e.g.
     position:absolute; inset:0 inside a sized box). DPR, resize
     rebuilds, and visibility gating are handled here; a figure only
     animates while on screen. handle.rebuild() re-seeds it — the
     linework tile wires that to a click.

     modes: 'room' {} · 'pdu' {onFrames(n)} · 'scatter' {}
            · 'streamlines' {} · 'contours' {} · 'harmonograph' {}

   PortfolioGraphics.rebuildAll()
     Re-seed every mounted figure (after a palette change).

   Under prefers-reduced-motion each figure renders once as a finished
   still instead of animating; the loop pauses while the tab is hidden.

   Each builder below receives (ctx, dim, opts) and returns {frame(t)}.
   Builders draw only with `pal` colors, derive every size from
   dim.w/dim.h (a resize rebuilds them from scratch), and repaint the
   background each frame, so repeated frame() calls always land on a
   composed image — the reduced-motion still relies on that. Module
   scope provides pal, hexToRgba, pointer (window mouse position) and
   cfg.monoFont.
   ==================================================================== */
window.PortfolioGraphics = (function(){
  var pointer = { x:-9999, y:-9999, active:false };
  var anims = [];
  var rafId = null, _frameCount = 0;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pal = { bg:'#111111', fg:'#EEEEEE', accent:'#888888', muted:'#777777', blue:'#999999', light:false };
  var cfg = { monoFont:'ui-monospace, SFMono-Regular, Menlo, monospace' };
  var booted = false;

  function hexToRgba(hex, a){
    hex = (hex||'#000').trim();
    if (hex.indexOf('rgb')===0) return hex;
    var h = hex.replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var BUILDERS = {};

  // ROOM WIREFRAME (roomstudio)
  BUILDERS.room = function(ctx, dim, opts){
    function box(cx,cy,cz,w,h,d){
      var x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2;
      var v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
      var e=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      return {v:v,e:e};
    }
    var room = box(0,0,0,4.2,2.6,4.2);
    var sofa = box(-1.0,-0.85,0.9,1.8,0.9,0.8);
    var table = box(0.9,-1.0,-0.5,1.1,0.6,1.1);
    var det = box(-1.0,-0.85,0.9,2.0,1.1,1.0);
    var groups = [ {g:room,hi:false},{g:sofa,hi:false},{g:table,hi:false},{g:det,hi:true} ];
    var focal = Math.min(dim.w,dim.h)*0.9;
    var cam = 6.4;
    var start = null;
    function proj(p, yaw){
      var cs=Math.cos(yaw), sn=Math.sin(yaw);
      var x=p[0]*cs - p[2]*sn;
      var z=p[0]*sn + p[2]*cs;
      var y=p[1];
      var zz = z + cam;
      var sx = dim.w/2 + (x*focal)/zz;
      var sy = dim.h/2 - (y*focal)/zz + dim.h*0.06;
      return [sx,sy];
    }
    return { frame:function(t){
      if(start===null) start=t;
      var el = t-start;
      var yaw = Math.sin(t*0.16)*0.4 - 0.15;
      ctx.fillStyle=pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      var reveal = Math.min(1, el/2.4);
      for(var gi=0;gi<groups.length;gi++){ var G=groups[gi].g, hi=groups[gi].hi;
        var projected = G.v.map(function(v){ return proj(v,yaw); });
        ctx.strokeStyle = hi ? hexToRgba(pal.accent,0.9) : hexToRgba(pal.fg,0.42);
        ctx.lineWidth = hi ? 1.4 : 0.9;
        G.e.forEach(function(edge,idx){
          var prog = Math.max(0, Math.min(1, reveal*G.e.length - idx));
          if(prog<=0) return;
          var a=projected[edge[0]], b=projected[edge[1]];
          ctx.beginPath(); ctx.moveTo(a[0],a[1]);
          ctx.lineTo(a[0]+(b[0]-a[0])*prog, a[1]+(b[1]-a[1])*prog); ctx.stroke();
        });
        if(hi && reveal>=1){
          ctx.fillStyle=hexToRgba(pal.accent,0.9);
          projected.forEach(function(pt){ ctx.fillRect(pt[0]-2,pt[1]-0.5,4,1); ctx.fillRect(pt[0]-0.5,pt[1]-2,1,4); });
        }
      }
    }};
  };

  // PDU BIT LAYOUT (vehicle networks)
  // What an ARXML parser actually yields: signals packed into a PDU at a start
  // position, a size, and a byte order. Signals are laid in one at a time — that
  // is the parse — and once the layout resolves the frame starts transmitting,
  // with the live signal's bits changing between frames the way a periodic send
  // with an automated value sweep does. Bit position ascends left to right so a
  // span reads like a line of text and its wrap across a byte boundary is the
  // staircase you can see — the point of the picture is that a signal is a run of
  // bits at an offset, not a field in a struct.
  BUILDERS.pdu = function(ctx, dim, opts){
    var NBYTE=6, NBIT=8, NCELL=NBYTE*NBIT;
    var SIGNALS=[
      {n:'VehicleSpeed', s:0,  l:13},
      {n:'EngineSpeed',  s:13, l:12},
      {n:'BrakePressed', s:25, l:1 },
      {n:'TurnIndicator',s:26, l:2 },
      {n:'AmbientTemp',  s:28, l:9 },
      {n:'DoorState',    s:37, l:4 },
      {n:'GearPosition', s:41, l:4 }
    ];
    var bits=new Array(NCELL), owner=new Array(NCELL), i;
    for(i=0;i<NCELL;i++){ bits[i]=Math.random()<0.42?1:0; owner[i]=-1; }
    SIGNALS.forEach(function(sg,si){ for(var b=sg.s;b<sg.s+sg.l&&b<NCELL;b++) owner[b]=si; });

    var LAY=0.34, TICK=0.5, HOLD=8;     // parse stagger · frame period · frames per signal
    var start=null, lastT=null, lastTick=0, frames=0, live=0;

    return { frame:function(t){
      if(start===null){ start=t; lastTick=t; lastT=t; }
      // Count elapsed time only while the canvas is actually on screen. The loop
      // skips off-screen canvases, so a gap in calls means we were not drawing —
      // without this the parse would be over before anyone scrolled down to it.
      if(t-lastT>0.5){ var skip=t-lastT; start+=skip; lastTick+=skip; }
      lastT=t;
      var el=t-start;
      var shown=Math.min(SIGNALS.length, Math.floor(el/LAY));
      var laid=shown>=SIGNALS.length;

      if(laid && t-lastTick>=TICK){
        lastTick=t; frames++;
        if(frames%HOLD===0) live=(live+1)%SIGNALS.length;
        var sg=SIGNALS[live];
        for(var b=sg.s;b<sg.s+sg.l&&b<NCELL;b++) bits[b]=Math.random()<0.5?1:0;
        if(opts.onFrames) opts.onFrames(frames);
      }

      var pad=Math.max(8, Math.min(dim.w,dim.h)*0.05);
      var fs=Math.max(7, Math.min(11, dim.w*0.021));
      var gut=fs*2.6, topH=fs*1.7;

      ctx.fillStyle=pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      ctx.font='400 '+fs.toFixed(1)+'px '+cfg.monoFont;
      ctx.textBaseline='middle';

      // Two legend columns when the labels fit side by side, one when they don't —
      // the row count feeds back into how much height the grid gets.
      var labels=SIGNALS.map(function(g){ return g.n+'  ['+g.s+':'+g.l+']'; });
      var labelW=0;
      for(var li=0;li<labels.length;li++) labelW=Math.max(labelW, ctx.measureText(labels[li]).width);
      var legCols=(pad*2+labelW*2+fs*1.2<=dim.w)?2:1;
      var legRows=Math.ceil(SIGNALS.length/legCols);
      var legH=legRows*(fs*1.55)+fs*2.1;

      var availW=dim.w-pad*2-gut, availH=dim.h-pad*2-topH-legH;
      var cell=Math.max(4, Math.min(availW/NBIT, availH/NBYTE));
      var gx=pad+gut+(availW-cell*NBIT)/2, gy=pad+topH+(availH-cell*NBYTE)/2;

      ctx.fillStyle=hexToRgba(pal.muted,0.7); ctx.textAlign='center';
      for(var c=0;c<NBIT;c++) ctx.fillText(String(c), gx+c*cell+cell/2, gy-topH*0.5);
      ctx.textAlign='right';
      for(var r=0;r<NBYTE;r++) ctx.fillText(String(r), gx-cell*0.32, gy+r*cell+cell/2);

      function cx(b){ return gx+(b&7)*cell; }
      function cy(b){ return gy+(b>>3)*cell; }
      function vis(b){ var s=owner[b]; return s>=0&&s<shown; }

      // 1 — the empty frame, so unallocated bits still read as part of the PDU
      ctx.strokeStyle=hexToRgba(pal.fg,0.10); ctx.lineWidth=0.7;
      for(var b2=0;b2<NCELL;b2++) ctx.strokeRect(cx(b2)+0.5,cy(b2)+0.5,cell-1,cell-1);

      // 2 — banding, so adjacent signals separate at a glance
      for(b2=0;b2<NCELL;b2++){
        if(!vis(b2)) continue;
        var si=owner[b2], lv=laid&&si===live;
        if(!lv && si%2!==0) continue;
        ctx.fillStyle=lv?hexToRgba(pal.accent,0.14):hexToRgba(pal.fg,0.07);
        ctx.fillRect(cx(b2),cy(b2),cell,cell);
      }

      // 3 — bit values, subordinate to the structure
      for(b2=0;b2<NCELL;b2++){
        if(!vis(b2)||!bits[b2]) continue;
        var lv3=laid&&owner[b2]===live, m=cell*0.33;
        ctx.fillStyle=lv3?hexToRgba(pal.accent,0.95):hexToRgba(pal.fg,0.38);
        ctx.fillRect(cx(b2)+m,cy(b2)+m,cell-2*m,cell-2*m);
      }

      // 4 — each signal's outline, drawn edge by edge wherever a cell borders a
      //     different signal. Spans wrap across byte rows, so the perimeter is a
      //     staircase and no rectangle would trace it.
      for(b2=0;b2<NCELL;b2++){
        if(!vis(b2)) continue;
        var s4=owner[b2], lv4=laid&&s4===live;
        var col=b2&7, row=b2>>3, x4=cx(b2), y4=cy(b2);
        ctx.strokeStyle=lv4?hexToRgba(pal.accent,0.95):hexToRgba(pal.fg,0.55);
        ctx.lineWidth=lv4?1.6:1.1;
        ctx.beginPath();
        if(col===0      || owner[b2-1]!==s4){ ctx.moveTo(x4,y4);           ctx.lineTo(x4,y4+cell); }
        if(col===NBIT-1 || owner[b2+1]!==s4){ ctx.moveTo(x4+cell,y4);      ctx.lineTo(x4+cell,y4+cell); }
        if(row===0      || owner[b2-8]!==s4){ ctx.moveTo(x4,y4);           ctx.lineTo(x4+cell,y4); }
        if(row===NBYTE-1|| owner[b2+8]!==s4){ ctx.moveTo(x4,y4+cell);      ctx.lineTo(x4+cell,y4+cell); }
        ctx.stroke();
      }

      // Legend sits under the grid block, not flush to the canvas edge, so the
      // whole composition reads as one column.
      var blockL=gx-gut;
      var colStep=Math.max(labelW+fs*1.2, (gut+cell*NBIT)/legCols);
      if(blockL+colStep*(legCols-1)+labelW>dim.w-pad) colStep=(dim.w-pad-labelW-blockL)/Math.max(1,legCols-1);
      var ly=gy+NBYTE*cell+fs*2.1;
      ctx.textAlign='left';
      for(var s2=0;s2<SIGNALS.length;s2++){
        var cy2=ly+((s2/legCols)|0)*(fs*1.55);
        if(cy2>dim.h-pad*0.3) break;
        var on=s2<shown, lv=laid&&s2===live;
        ctx.fillStyle=lv?hexToRgba(pal.accent,0.95):(on?hexToRgba(pal.fg,0.5):hexToRgba(pal.fg,0.13));
        ctx.fillText(labels[s2], blockL+(s2%legCols)*colStep, cy2);
      }
    }};
  };

  // SCATTER (embeddings / nearest-neighbour search)
  // Cluster seeds are laid on a jittered 4x3 lattice in NORMALISED space, so the
  // field always spans the whole frame (purely random seeds clumped into one
  // corner) and any resize redistributes correctly without a rebuild.
  BUILDERS.scatter = function(ctx, dim, opts){
    var COLS=4, ROWS=3, PAD=0.06;
    var clusters=[];
    for(var cy=0;cy<ROWS;cy++) for(var cx=0;cx<COLS;cx++){
      clusters.push({
        x: PAD + (cx+0.5+(Math.random()-0.5)*0.55)/COLS*(1-2*PAD),
        y: PAD + (cy+0.5+(Math.random()-0.5)*0.55)/ROWS*(1-2*PAD)
      });
    }
    var N=Math.round(Math.min(190, Math.max(90, dim.w*dim.h/1100)));
    var pts=[];
    for(var j=0;j<N;j++){
      var c=clusters[j % clusters.length];   // round-robin: every cluster gets points
      var nx=Math.max(0.03,Math.min(0.97, c.x+(Math.random()-0.5)*0.20));
      var ny=Math.max(0.04,Math.min(0.96, c.y+(Math.random()-0.5)*0.24));
      pts.push({nx:nx, ny:ny, ph:Math.random()*6.28, sp:0.4+Math.random()*0.7});
    }
    var pairs=[]; var R=0.13;
    for(var a=0;a<pts.length && pairs.length<300;a++) for(var b=a+1;b<pts.length && pairs.length<300;b++){
      var ddx=pts[a].nx-pts[b].nx, ddy=pts[a].ny-pts[b].ny;
      if(ddx*ddx+ddy*ddy<R*R) pairs.push([a,b]);
    }
    var anchor=0, qStart=null;
    return { frame:function(t){
      ctx.fillStyle=pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      var P=pts.map(function(p){ return {x:p.nx*dim.w+Math.sin(t*0.5*p.sp+p.ph)*3.0, y:p.ny*dim.h+Math.cos(t*0.45*p.sp+p.ph)*3.0}; });
      ctx.strokeStyle=hexToRgba(pal.fg,0.10); ctx.lineWidth=0.7;
      for(var pi=0;pi<pairs.length;pi++){ var e=pairs[pi]; ctx.beginPath(); ctx.moveTo(P[e[0]].x,P[e[0]].y); ctx.lineTo(P[e[1]].x,P[e[1]].y); ctx.stroke(); }
      if(qStart===null||t-qStart>3.4){ qStart=t; anchor=(Math.random()*P.length)|0; }
      var ph=Math.min(1,(t-qStart)/1.5);
      var near=P.map(function(p,i){ return {i:i,d:Math.hypot(p.x-P[anchor].x,p.y-P[anchor].y)}; }).filter(function(o){return o.i!==anchor;}).sort(function(a,b){return a.d-b.d;}).slice(0,6);
      ctx.strokeStyle=hexToRgba(pal.accent,0.7); ctx.lineWidth=1;
      near.forEach(function(o){ var b=P[o.i]; ctx.beginPath(); ctx.moveTo(P[anchor].x,P[anchor].y); ctx.lineTo(P[anchor].x+(b.x-P[anchor].x)*ph, P[anchor].y+(b.y-P[anchor].y)*ph); ctx.stroke(); });
      P.forEach(function(p,i){
        var isN=near.some(function(o){return o.i===i;});
        ctx.fillStyle=(i===anchor)?hexToRgba(pal.accent,0.95):(isN?hexToRgba(pal.accent,0.7):hexToRgba(pal.fg,0.5));
        var s=(i===anchor)?3:1.4;
        ctx.fillRect(p.x-s,p.y-0.5,s*2,1); ctx.fillRect(p.x-0.5,p.y-s,1,s*2);
      });
    }};
  };

  // STREAMLINES (packed-bed CFD)
  // The bed is a RANDOM packing settled by relaxation, not a lattice — a lattice
  // reads as a mechanical grid, and a real bed is randomly packed. Radii are
  // polydisperse and a minimum gap is enforced, so a percolating void always exists.
  // Flow is superposed potential flow past cylinders (doublet field) rather than
  // naive repulsion, which would exceed the free-stream velocity at a particle
  // surface and stall the line head-on. A tracer-dispersion term perturbs each
  // path independently, so neighbouring paths diverge, converge and cross the way
  // dye traces do in a real bed instead of running as clean parallel curves.
  BUILDERS.streamlines = function(ctx, dim, opts){
    var rB=Math.max(8,Math.min(dim.w,dim.h)/15);
    var GAP=rB*0.26;
    var n=Math.round((dim.w*dim.h)/(Math.PI*rB*rB)*0.55);
    var circles=[], i, j;
    for(i=0;i<n;i++) circles.push({
      x: Math.random()*(dim.w+2*rB)-rB,
      y: rB+Math.random()*(dim.h-2*rB),
      r: rB*(0.62+Math.random()*0.53)
    });
    for(var pass2=0;pass2<90;pass2++){               // settle: push overlaps apart
      for(i=0;i<circles.length;i++) for(j=i+1;j<circles.length;j++){
        var A=circles[i], B=circles[j];
        var ddx=B.x-A.x, ddy=B.y-A.y, dd=Math.hypot(ddx,ddy)||0.001;
        var need=A.r+B.r+GAP;
        if(dd<need){
          var push=(need-dd)/2, px=ddx/dd, py=ddy/dd;
          A.x-=px*push; A.y-=py*push; B.x+=px*push; B.y+=py*push;
        }
      }
      for(i=0;i<circles.length;i++){
        var P=circles[i];
        if(P.y<P.r+1) P.y=P.r+1;
        if(P.y>dim.h-P.r-1) P.y=dim.h-P.r-1;
        if(P.x<P.r-4) P.x=P.r-4;                     // keep clear of the inlet plane
      }
    }

    function deflect(p){                              // never sit inside a particle
      for(var k=0;k<7;k++) for(var q=0;q<circles.length;q++){
        var c=circles[q], dx=p[0]-c.x, dy=p[1]-c.y, d=Math.hypot(dx,dy), md=c.r*1.03;
        if(d<md && d>1e-6){ p[0]=c.x+dx/d*md; p[1]=c.y+dy/d*md; }
      }
      return p;
    }

    var STEP=2.0, MAXSTEP=2400, MINFWD=0.20, WOBBLE=0.95;
    var lines=[], seeds=Math.max(10,Math.round(dim.h/20));
    for(i=0;i<seeds;i++){
      var sd=i*1.7+0.3;                               // per-path dispersion seed
      var seedPt=deflect([-10,(i+0.5)*(dim.h/seeds)]);
      var sx=seedPt[0], sy=seedPt[1], pts=[[sx,sy]];
      for(var step=0;step<MAXSTEP && sx<dim.w+12;step++){
        var vx=1, vy=0;
        for(var ci=0;ci<circles.length;ci++){
          var c2=circles[ci], dx2=sx-c2.x, dy2=sy-c2.y, r2=dx2*dx2+dy2*dy2, a2=c2.r*c2.r;
          if(r2 < a2*12 && r2 > 1e-6){
            var inv=a2/(r2*r2);
            vx += -(dx2*dx2-dy2*dy2)*inv;
            vy += -(2*dx2*dy2)*inv;
          }
        }
        vy += ((dim.h/2)-sy)*0.0006;                                     // gentle centring
        vy += WOBBLE*Math.sin(sx*0.035+sd*7.13)*Math.cos(sy*0.028-sd*3.7); // dispersion
        var m=Math.hypot(vx,vy)||1, ux=vx/m, uy=vy/m;
        if(ux < MINFWD){                              // never stall or run backwards
          ux = MINFWD;
          uy = (uy<0?-1:1)*Math.sqrt(1-MINFWD*MINFWD);
        }
        sx += ux*STEP; sy += uy*STEP;
        if(sy < 2){ sy = 2; } else if(sy > dim.h-2){ sy = dim.h-2; }
        var np=deflect([sx,sy]); sx=np[0]; sy=np[1];
        pts.push([sx,sy]);
      }
      lines.push({pts:pts, a:0.5+Math.random()*0.38});
    }
    return { frame:function(t){
      ctx.fillStyle=pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      ctx.strokeStyle=hexToRgba(pal.fg,0.34); ctx.lineWidth=0.9;
      for(var ci=0;ci<circles.length;ci++){ var c=circles[ci]; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,6.2832); ctx.stroke(); }
      ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*42;
      for(var li=0;li<lines.length;li++){
        var L=lines[li], pts=L.pts;
        ctx.strokeStyle=hexToRgba(pal.accent,L.a);   // varied per path, suggesting velocity
        ctx.lineWidth=0.9+L.a*0.5;
        ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
        for(var pi=1;pi<pts.length;pi++) ctx.lineTo(pts[pi][0],pts[pi][1]);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }};
  };

  // INTERFERENCE CONTOURS (hero). Six wave sources — one per domain —
  // share a single surface; the drawing is that surface's level sets,
  // traced by marching squares every frame. The cursor joins as a
  // seventh source. A scalar field read like a printed contour plate:
  // no particles, no advection, no noise field — nothing persists
  // between frames except the equations.
  BUILDERS.contours = function(ctx, dim, opts){
    function R(a,b){ return a + Math.random()*(b-a); }
    var TAU = 6.28318, S = 6, srcs = [], i, n;
    for (i=0;i<S;i++){
      var an = (i/S)*TAU + R(-0.4,0.4) + 0.5;
      srcs.push({
        x: 0.5 + Math.cos(an)*R(0.26,0.46),
        y: 0.5 + Math.sin(an)*R(0.22,0.40),
        lam: R(0.24,0.42),
        sp: R(0.35,0.9)*(Math.random()<0.5?-1:1),
        ph: R(0,TAU)
      });
    }
    var mind = Math.max(60, Math.min(dim.w, dim.h));
    var cell = Math.max(7.5, mind/48);
    var nx = Math.max(20, Math.round(dim.w/cell));
    var ny = Math.max(12, Math.round(dim.h/cell));
    var vx = nx+1, vy = ny+1, NV = vx*vy;
    var f = new Float32Array(NV), px = new Float32Array(NV), py = new Float32Array(NV);
    for (var yy=0; yy<vy; yy++) for (var xx=0; xx<vx; xx++){
      var id = yy*vx+xx; px[id] = xx*dim.w/nx; py[id] = yy*dim.h/ny;
    }
    var dists = [];
    for (i=0;i<S;i++){
      var D = new Float32Array(NV), sx = srcs[i].x*dim.w, sy = srcs[i].y*dim.h;
      for (n=0;n<NV;n++) D[n] = Math.hypot(px[n]-sx, py[n]-sy)/mind;
      dists.push(D);
    }
    var LEVELS = [-2.2,-1.76,-1.32,-0.88,-0.44,0,0.44,0.88,1.32,1.76,2.2];
    // segment table by corner mask (TL=8,TR=4,BR=2,BL=1); edges 0 top,
    // 1 right, 2 bottom, 3 left; flat pairs, two pairs for the saddles
    var SEGS = [null,[3,2],[1,2],[3,1],[0,1],[0,3,1,2],[0,2],[0,3],
                [0,3],[0,2],[0,1,2,3],[0,1],[3,1],[1,2],[3,2],null];
    var A,B,C,D2,X0,X1,Y0,Y1, EP = new Float32Array(4);
    function ept(edge, k){
      var tt;
      if (edge===0){ tt=A/(A-B);  EP[k]=X0+(X1-X0)*tt; EP[k+1]=Y0; }
      else if (edge===1){ tt=B/(B-C);  EP[k]=X1; EP[k+1]=Y0+(Y1-Y0)*tt; }
      else if (edge===2){ tt=D2/(D2-C); EP[k]=X0+(X1-X0)*tt; EP[k+1]=Y1; }
      else { tt=A/(A-D2); EP[k]=X0; EP[k+1]=Y0+(Y1-Y0)*tt; }
    }
    function levelStyle(L){
      var aL = Math.abs(L);
      if (L>1.7) return { c: hexToRgba(pal.accent, 0.95), w: 1.3 };
      if (L<-1.7) return { c: hexToRgba(pal.blue, 0.85), w: 1.15 };
      if (aL<0.01) return { c: hexToRgba(pal.fg, 0.6), w: 1.0 };
      return { c: hexToRgba(pal.fg, 0.5-aL*0.14), w: 0.85 };
    }
    return { frame: function(t){
      var s2, ptrx=-1, ptry=-1, hasPtr=false;
      var rect = ctx.canvas.getBoundingClientRect();
      if (pointer.active){
        var mx = pointer.x - rect.left, my = pointer.y - rect.top;
        if (mx>-60 && my>-60 && mx<dim.w+60 && my<dim.h+60){ ptrx=mx; ptry=my; hasPtr=true; }
      }
      for (n=0;n<NV;n++){
        var v = 0;
        for (s2=0;s2<S;s2++){ var sc = srcs[s2]; v += Math.sin(dists[s2][n]/sc.lam*TAU - t*sc.sp + sc.ph); }
        if (hasPtr){
          var dd = Math.hypot(px[n]-ptrx, py[n]-ptry)/mind;
          v += 1.6*Math.sin(dd/0.26*TAU - t*2.6)*Math.exp(-dd*2.2);
        }
        f[n] = v;
      }
      ctx.fillStyle = pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      for (var li=0; li<LEVELS.length; li++){
        var L = LEVELS[li], st = levelStyle(L);
        ctx.strokeStyle = st.c; ctx.lineWidth = st.w;
        ctx.beginPath();
        for (var cy=0; cy<ny; cy++){
          var r0 = cy*vx, r1 = r0+vx;
          Y0 = py[r0]; Y1 = py[r1];
          for (var cx=0; cx<nx; cx++){
            var i0=r0+cx;
            A=f[i0]-L; B=f[i0+1]-L; C=f[r1+cx+1]-L; D2=f[r1+cx]-L;
            var m=(A>0?8:0)|(B>0?4:0)|(C>0?2:0)|(D2>0?1:0);
            var sg=SEGS[m];
            if (!sg) continue;
            X0 = px[i0]; X1 = px[i0+1];
            ept(sg[0],0); ept(sg[1],2);
            ctx.moveTo(EP[0],EP[1]); ctx.lineTo(EP[2],EP[3]);
            if (sg.length===4){
              ept(sg[2],0); ept(sg[3],2);
              ctx.moveTo(EP[0],EP[1]); ctx.lineTo(EP[2],EP[3]);
            }
          }
        }
        ctx.stroke();
      }
    }};
  };

  // HARMONOGRAPH (linework tile). What linework makes, made the way
  // linework makes it: a damped two-pendulum trace per axis plus a slow
  // circular drift, integrated once per seed and drawn in the way a
  // plotter draws — one pen in ink, a detuned echo in the accent.
  // rebuild() replots a fresh seed; the page wires it to a click.
  BUILDERS.harmonograph = function(ctx, dim, opts){
    function R(a,b){ return a + Math.random()*(b-a); }
    function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
    var TAU = 6.28318, FR = [1,2,3,4,5];
    var f1=pick(FR)+R(-0.006,0.006), f2=pick(FR)+R(-0.006,0.006);
    var f3=pick(FR)+R(-0.006,0.006), f4=pick(FR)+R(-0.006,0.006);
    var fr=pick([1,2,3]);
    var p1=R(0,TAU), p2=R(0,TAU), p3=R(0,TAU), p4=R(0,TAU), pr=R(0,TAU);
    var d1=R(0.00075,0.0019), d2=R(0.00075,0.0019), dr=R(0.0009,0.0016);
    var det=R(0.006,0.022)*(Math.random()<0.5?-1:1);
    var N=3600, DT=0.021;
    function trace(detune){
      var out=new Float32Array(N*2), T=0, n;
      for (n=0;n<N;n++){
        T+=DT;
        var e1=Math.exp(-d1*n), e2=Math.exp(-d2*n), e3=Math.exp(-dr*n);
        out[n*2]   = Math.sin(T*f1+p1)*e1 + 0.85*Math.sin(T*(f2+detune)+p2)*e2 + 0.5*Math.sin(T*fr+pr)*e3;
        out[n*2+1] = Math.sin(T*f3+p3)*e2 + 0.85*Math.sin(T*(f4+detune)+p4)*e1 + 0.5*Math.cos(T*fr+pr)*e3;
      }
      return out;
    }
    var Apts=trace(0), Bpts=trace(det);
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,k;
    for (k=0;k<N;k++){
      var xa=Apts[k*2],ya=Apts[k*2+1],xb=Bpts[k*2],yb=Bpts[k*2+1];
      if(xa<minx)minx=xa; if(xa>maxx)maxx=xa; if(ya<miny)miny=ya; if(ya>maxy)maxy=ya;
      if(xb<minx)minx=xb; if(xb>maxx)maxx=xb; if(yb<miny)miny=yb; if(yb>maxy)maxy=yb;
    }
    var mg=Math.min(dim.w,dim.h)*0.09;
    var sc2=Math.min((dim.w-2*mg)/Math.max(1e-6,maxx-minx),(dim.h-2*mg)/Math.max(1e-6,maxy-miny));
    var ox=(dim.w-(maxx-minx)*sc2)/2 - minx*sc2;
    var oy=(dim.h-(maxy-miny)*sc2)/2 - miny*sc2;
    var start=null, last=null;
    function poly(P,n){
      ctx.beginPath();
      ctx.moveTo(P[0]*sc2+ox, P[1]*sc2+oy);
      for (var q=1;q<n;q++) ctx.lineTo(P[q*2]*sc2+ox, P[q*2+1]*sc2+oy);
      ctx.stroke();
    }
    return { frame: function(t){
      if (start===null){ start=t; last=t; }
      if (t-last>0.5) start += t-last;   // don't spend the draw-in while off screen
      last=t;
      var n = Math.max(2, Math.min(N, Math.floor(N*(t-start)/3.4)));
      ctx.fillStyle=pal.bg; ctx.fillRect(0,0,dim.w,dim.h);
      ctx.lineJoin='round';
      ctx.strokeStyle=hexToRgba(pal.accent,0.55); ctx.lineWidth=0.8; poly(Bpts,n);
      ctx.strokeStyle=hexToRgba(pal.fg,0.8); ctx.lineWidth=1.05; poly(Apts,n);
    }};
  };

  function renderStatic(anim){ try { for (var i=0;i<160;i++) anim.frame(i*0.06); } catch(e){} }
  function startLoop(){
    function loop(){
      var t = performance.now()/1000;
      for (var i=0;i<anims.length;i++){ var a=anims[i]; if (a.visible){ try { a.frame(t); } catch(e){} } }
      _frameCount++;
      rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }
  function boot(){
    if (booted) return;
    booted = true;
    window.addEventListener('mousemove', function(e){ pointer = { x:e.clientX, y:e.clientY, active:true }; });
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }
      else if(!reduced && !rafId && anims.length) startLoop();
    });
    if(!reduced) startLoop();
  }

  function mount(canvas, mode, opts){
    if (!canvas || !BUILDERS[mode]) return null;
    opts = opts || {};
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var ctx = canvas.getContext('2d');
    var dim = { w:1, h:1 };
    function size(){
      var r = canvas.getBoundingClientRect();
      dim.w = Math.max(1, r.width); dim.h = Math.max(1, r.height);
      canvas.width = Math.round(dim.w*dpr); canvas.height = Math.round(dim.h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    size();
    var st = BUILDERS[mode](ctx, dim, opts);
    var anim = {
      canvas:canvas, ctx:ctx, dim:dim, visible:false, mode:mode, opts:opts,
      frame:function(t){ st.frame(t); },
      // Resizing the backing store clears it, so always repaint immediately —
      // otherwise a panel sits blank until the next observer callback.
      rebuild:function(){ size(); st = BUILDERS[mode](ctx, dim, opts); try { st.frame(0); } catch(e){} if (reduced) renderStatic(anim); }
    };
    anim.ro = new ResizeObserver(function(){ anim.rebuild(); });
    anim.ro.observe(canvas);
    anim.io = new IntersectionObserver(function(es){ es.forEach(function(e){ anim.visible = e.isIntersecting; }); }, { threshold:0 });
    anim.io.observe(canvas);
    anims.push(anim);
    // Paint one frame straight away so a panel is never an empty box while we wait
    // for IntersectionObserver (which is throttled in background/inactive tabs).
    if (reduced) renderStatic(anim); else { try { anim.frame(0); } catch(e){} }
    boot();
    return { rebuild: anim.rebuild, canvas: canvas };
  }

  return {
    setPalette: function(p){ for (var k in p) if (Object.prototype.hasOwnProperty.call(p,k)) pal[k]=p[k]; },
    config: function(c){ for (var k in c) if (Object.prototype.hasOwnProperty.call(c,k)) cfg[k]=c[k]; },
    mount: mount,
    rebuildAll: function(){ anims.forEach(function(a){ a.rebuild(); }); },
    reducedMotion: function(){ return reduced; }
  };
})();
</script>
<script>
(function(){
  var PG = window.PortfolioGraphics;
  PG.setPalette({ bg:'#F3EFE6', fg:'#211E17', accent:'#2440C8', muted:'#6C6555', blue:'#177E5B', light:true });
  PG.config({ monoFont:'ui-monospace, Menlo, monospace' });
  PG.mount(document.getElementById('cv-og'), 'contours', {});
})();
</script>
